name: Container check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed revision
        # actions/checkout v7.0.1; verified against the official release.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the pinned upstream wrapper
        run: docker build --pull --progress=plain --tag otterwiki-railway:smoke .

      - name: Build the previous version with its unchanged wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          def git_blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          # This release changes the base image only. Refuse to label a changed
          # bootstrap/startup wrapper as the previous release in the upgrade test.
          for name, expected in {
              "docker/bootstrap.py": "3fb4114a4016c1546b763562758351aa712187e9",
              "docker/start.sh": "d5e027d9c70bf135494e45f89717ce306cc67d6c",
          }.items():
              if git_blob(Path(name).read_bytes()) != expected:
                  raise SystemExit("Previous-wrapper runtime no longer matches the recorded release")
          current = Path("Dockerfile").read_bytes()
          first, separator, rest = current.partition(b"\n")
          if first != b"FROM redimp/otterwiki:2.27.0@sha256:9cf1d76c6bff097ff924404aa5a149b235b15aaa05553870e96504cd1d92752b":
              raise SystemExit("Unexpected candidate base image")
          previous = (b"FROM redimp/otterwiki:2.26.3@sha256:74740588190fa25dcb01ba4bde11e53d7a3db544d25a8afcb2e385fb5fbce3d7"
                      + separator + rest)
          if git_blob(previous) != "0bb038ae87caad5d442948a6e8403bef61eea925":
              raise SystemExit("Previous Dockerfile no longer matches the recorded release")
          Path(os.environ["RUNNER_TEMP"], "Dockerfile.previous").write_bytes(previous)
          PY
          docker build --pull --progress=plain --file "$RUNNER_TEMP/Dockerfile.previous" --tag otterwiki-railway:previous .

      - name: Exercise the real container and persistent data
        run: >-
          bash tests/container-smoke.sh
          --image otterwiki-railway:smoke
          --upgrade-from-image otterwiki-railway:previous
          --report "$RUNNER_TEMP/container-smoke.json"

      - name: Publish the sanitized result in the job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/container-smoke.json" ]; then
            cat "$RUNNER_TEMP/container-smoke.json"
            {
              echo '## Container validation'
              echo '```json'
              cat "$RUNNER_TEMP/container-smoke.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
